name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon, supporte universal2 cross-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ffmpeg (pour miniatures vidéo)
        run: brew install ffmpeg

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version from version.json
        id: version
        run: |
          VER=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "🔖 Building v$VER"

      - name: Build .app (dev mode = native arch, fast CI)
        run: |
          chmod +x build.sh
          ./build.sh --dev

      - name: Verify artifacts
        run: |
          ls -lh dist/
          test -d dist/BikeRhapsodyClient.app
          test -f dist/BikeRhapsodyClient-universal2.app.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.version.outputs.version }}"
          body: |
            ## Bike Rhapsody Client v${{ steps.version.outputs.version }}

            Voir le [CHANGELOG](https://github.com/dadou42/bike-rhapsody-client/blob/main/CHANGELOG.md) pour le détail des changements.

            ### 📦 Installation
            1. Télécharge `BikeRhapsodyClient-universal2.app.zip` ci-dessous
            2. Décompresse et glisse `BikeRhapsodyClient.app` dans `/Applications`
            3. Au premier lancement → autoriser dans **Réglages → Confidentialité et sécurité**

            ### ⚡ Mise à jour automatique
            Les utilisateurs déjà installés recevront automatiquement la mise à jour au prochain démarrage.
          files: |
            dist/BikeRhapsodyClient-universal2.app.zip
          draft: false
          prerelease: false
